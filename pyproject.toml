# pyproject.toml -- the modern Python project manifest.
#
# It replaces requirements.txt AND makes `src/` a real, installable package.
# That second part is what makes `from src.ingestion.api import TMDbClient`
# resolve identically in a test, a script, a notebook and a container.
#
# Install for development with:   pip install -e ".[dev]"
# The -e means "editable": your edits take effect immediately, with no reinstall.

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tmdb-movie-analysis"
version = "1.0.0"
description = "Production-grade TMDb movie data pipeline: extract, clean, validate, analyse."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# Kept separate from the runtime dependencies on purpose: a production container
# should not ship pytest, jupyter or a linter.
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "responses>=0.25",     # intercepts HTTP so tests never touch the network
    "ruff>=0.5",           # linter + formatter
]
notebook = [
    "jupyterlab>=4.0",
    "matplotlib>=3.8",
]

[project.scripts]
# Installs a real command: `tmdb-pipeline --env prod`
tmdb-pipeline = "scripts.run_pipeline:main"

[tool.setuptools.packages.find]
include = ["src*", "scripts*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
